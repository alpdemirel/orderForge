[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orderforge"
version = "0.1.0"
description = "Deterministic L3 market simulation pipeline for backtesting strategies on Bitfinex BTC-USD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["capture*", "market_data*", "exchange*", "strategy*", "common*", "sim*"]